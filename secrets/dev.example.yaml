# Plaintext shape only. Do not put real development secrets in this file.
# Mirror this shape in the encrypted secrets/dev.yaml (SOPS + age). Each
# workspace documents the values it consumes in its own README, and
# `just dev-env-generate` composes each workspace's .env.local from the three
# dev layers. Keep non-secret values in config/dev.yaml — a key never lives in
# both tracked layers.
apps:
  web:
    DATABASE_URL: postgresql://wordhold:wordhold@127.0.0.1:5433/wordhold_dev
    AUTH_SECRET: replace-with-a-long-random-dev-secret
    GITHUB_CLIENT_ID: replace-with-github-oauth-app-client-id
    GITHUB_CLIENT_SECRET: replace-with-github-oauth-app-client-secret
    GITHUB_ALLOWED_USER_ID: replace-with-your-numeric-github-user-id
    AWS_ACCESS_KEY_ID: replace-with-aws-access-key-id
    AWS_SECRET_ACCESS_KEY: replace-with-aws-secret-access-key
    GOOGLE_SERVICE_ACCOUNT_JSON: replace-with-service-account-json-single-line
packages:
  db:
    DATABASE_URL: postgresql://wordhold:wordhold@127.0.0.1:5433/wordhold_dev
