# Shared non-secret development configuration, keyed like secrets/dev.yaml
# (apps.<name>, packages.<name>). `just dev-env-generate` composes each
# workspace's .env.local from the three dev layers and any authorized
# broker-owned S3 pairs referenced by a plain layer. The local layer overrides
# the shared layers. A key never lives in both this file and secrets/dev.yaml.
# This file is seeded once and then owned by your repo.
apps:
  web:
    WORDHOLD_OWNER_TIME_ZONE: Europe/Berlin
    AWS_REGION: eu-central-1
    AI_JUDGE_MODEL: global.openai.gpt-5.6-luna
    AI_SENTENCE_MODEL: global.openai.gpt-5.6-luna
    AI_EXTRACTION_MODEL: gemini-3.7-flash
    AI_EXTRACTION_ESCALATION_MODEL: gemini-3.1-pro-preview
    GOOGLE_VERTEX_LOCATION: global
